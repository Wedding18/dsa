<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DSA Assignment Vault</title>
  <style>
    :root {
      --bg: #fafaf7;
      --card: #ffffff;
      --text: #1d1d1b;
      --muted: #6b6b66;
      --line: #e4e2da;
      --accent: #c2410c;
      --code: #f4f2ec;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #161615;
        --card: #1f1f1d;
        --text: #ecebe6;
        --muted: #9a9992;
        --line: #32312d;
        --accent: #fb923c;
        --code: #121211;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #161615;
      --card: #1f1f1d;
      --text: #ecebe6;
      --muted: #9a9992;
      --line: #32312d;
      --accent: #fb923c;
      --code: #121211;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 4px;
    }

    .sub {
      color: var(--muted);
      margin: 0 0 16px;
    }

    input[type="search"] {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      font: inherit;
      margin-bottom: 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 18px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item {
      text-align: left;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
      transition: 0.15s ease;
    }

    .item:hover {
      border-color: var(--accent);
    }

    .item small {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .item.on {
      border-color: var(--accent);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      min-width: 0;
    }

    .head {
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .head h2 {
      margin: 0 0 2px;
      font-size: 18px;
    }

    .tag {
      display: inline-block;
      font-size: 12px;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 99px;
      padding: 1px 9px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .head p {
      margin: 4px 0 12px;
      color: var(--muted);
    }

    .btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button.act {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button.alt {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 16px;
      font: inherit;
      cursor: pointer;
    }

    .codewrap {
      overflow-x: auto;
      background: var(--code);
      border-radius: 0 0 12px 12px;
    }

    pre {
      margin: 0;
      padding: 16px;
      font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      tab-size: 4;
      white-space: pre;
      overflow-x: auto;
      word-break: normal;
    }

    .empty {
      padding: 30px;
      color: var(--muted);
    }

    @media (max-width: 760px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .list {
        flex-direction: row;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .item {
        flex: 0 0 auto;
        max-width: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>DSA Assignment Vault</h1>
    <p class="sub">Pick an assignment, then copy the code.</p>
    <input type="search" id="q" placeholder="Search by name or data structure…" />

    <div class="layout">
      <div class="list" id="list"></div>
      <div class="panel" id="panel"></div>
    </div>
  </div>

  <script>
    const items = [
      {
        id: 'a01',
        file: '01_zigzag_rearrange.cpp',
        title: 'Zig-zag rearrange',
        ds: 'Array',
        desc: 'Arrange elements so every second element is greater than its neighbors.',
        code: '#include <iostream>\nusing namespace std;\n\nint main() {\n    int arr[] = {4, 3, 7, 8, 6, 2, 1};\n    int n = sizeof(arr) / sizeof(arr[0]);\n\n    for (int i = 0; i < n - 1; i++) {\n        if (i % 2 == 0 && arr[i] > arr[i + 1]) swap(arr[i], arr[i + 1]);\n        if (i % 2 == 1 && arr[i] < arr[i + 1]) swap(arr[i], arr[i + 1]);\n    }\n\n    for (int x : arr) cout << x << " ";\n    cout << endl;\n    return 0;\n}'
      },
      {
        id: 'a02',
        file: '02_kadanes.cpp',
        title: 'Kadane\'s algorithm',
        ds: 'Array',
        desc: 'Find the maximum subarray sum in linear time.',
        code: '#include <iostream>\n#include <climits>\nusing namespace std;\n\nint kadane(int arr[], int n) {\n    int curr = 0, best = INT_MIN;\n    for (int i = 0; i < n; i++) {\n        curr = max(0, curr + arr[i]);\n        best = max(best, curr);\n    }\n    return best;\n}\n\nint main() {\n    int arr[] = {-2, 1, -3, 4, -1, 2, 1, -5, 4};\n    int n = sizeof(arr) / sizeof(arr[0]);\n    cout << kadane(arr, n) << endl;\n    return 0;\n}'
      },
      {
        id: 'a03',
        file: '03_graph_bfs.cpp',
        title: 'Graph BFS traversal',
        ds: 'Graph',
        desc: 'Traverse a graph level by level using a queue.',
        code: '#include <iostream>\n#include <queue>\n#include <vector>\nusing namespace std;\n\nvoid bfs(int start, vector<vector<int>>& graph, vector<bool>& visited) {\n    queue<int> q;\n    q.push(start);\n    visited[start] = true;\n\n    while (!q.empty()) {\n        int node = q.front();\n        q.pop();\n        cout << node << " ";\n\n        for (int nxt : graph[node]) {\n            if (!visited[nxt]) {\n                visited[nxt] = true;\n                q.push(nxt);\n            }\n        }\n    }\n}\n\nint main() {\n    vector<vector<int>> graph = {\n        {1, 2}, {0, 3}, {0, 4}, {1}, {2}\n    };\n    vector<bool> visited(graph.size(), false);\n    bfs(0, graph, visited);\n    cout << endl;\n    return 0;\n}'
      },
      {
        id: 'a04',
        file: '04_hash_frequency.cpp',
        title: 'Frequency count using hash map',
        ds: 'Hashing',
        desc: 'Count how many times each value appears in the array.',
        code: '#include <iostream>\n#include <unordered_map>\nusing namespace std;\n\nint main() {\n    int arr[] = {1, 3, 2, 1, 3, 2, 1};\n    int n = sizeof(arr) / sizeof(arr[0]);\n    unordered_map<int, int> freq;\n\n    for (int i = 0; i < n; i++) freq[arr[i]]++;\n\n    for (auto &entry : freq) {\n        cout << entry.first << " -> " << entry.second << endl;\n    }\n    return 0;\n}'
      },
      {
        id: 'a05',
        file: '05_stack_array.cpp',
        title: 'Stack using array',
        ds: 'Stack',
        desc: 'Implement push, pop, and peek with fixed-size array.',
        code: '#include <iostream>\nusing namespace std;\n\nclass Stack {\n    int topIndex;\n    int arr[5];\npublic:\n    Stack() : topIndex(-1) {}\n\n    bool push(int x) {\n        if (topIndex >= 4) return false;\n        arr[++topIndex] = x;\n        return true;\n    }\n\n    int pop() {\n        if (topIndex < 0) return -1;\n        return arr[topIndex--];\n    }\n\n    int peek() {\n        return (topIndex >= 0) ? arr[topIndex] : -1;\n    }\n};\n\nint main() {\n    Stack s;\n    s.push(10);\n    s.push(20);\n    cout << s.peek() << endl;\n    cout << s.pop() << endl;\n    return 0;\n}'
      }
    ];

    const listEl = document.getElementById('list');
    const panelEl = document.getElementById('panel');
    const q = document.getElementById('q');
    let cur = items[0].id;

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function copyText(text, button, label = 'Copied ✓') {
      function done() {
        const original = button.textContent;
        button.textContent = label;
        setTimeout(() => { button.textContent = original; }, 1500);
      }

      function fallback() {
        const a = document.createElement('textarea');
        a.value = text;
        a.style.position = 'fixed';
        a.style.opacity = '0';
        document.body.appendChild(a);
        a.select();
        try {
          document.execCommand('copy');
        } catch (e) {
          // ignore
        }
        document.body.removeChild(a);
        done();
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(fallback);
      } else {
        fallback();
      }
    }

    function renderList() {
      const s = q.value.toLowerCase();
      listEl.innerHTML = '';

      const matches = items.filter(item => {
        return (item.title + item.ds + item.desc).toLowerCase().includes(s);
      });

      matches.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'item' + (item.id === cur ? ' on' : '');
        btn.innerHTML = `${escapeHtml(item.title)}<small>${escapeHtml(item.ds)}</small>`;
        btn.onclick = () => {
          cur = item.id;
          location.hash = item.id;
          renderList();
          renderPanel();
        };
        listEl.appendChild(btn);
      });

      if (!matches.length) {
        listEl.innerHTML = '<div class="empty">No match</div>';
      }
    }

    function renderPanel() {
      const item = items.find(x => x.id === cur) || items[0];

      panelEl.innerHTML = `
        <div class="head">
          <span class="tag">${escapeHtml(item.ds)}</span>
          <h2>${escapeHtml(item.title)}</h2>
          <p>${escapeHtml(item.desc)} · ${escapeHtml(item.file)}</p>
          <div class="btns">
            <button class="act" id="copyBtn">Copy code</button>
            <button class="alt" type="button" id="selectBtn">Select</button>
          </div>
        </div>
        <div class="codewrap">
          <pre>${escapeHtml(item.code)}</pre>
        </div>
      `;

      document.getElementById('copyBtn').addEventListener('click', function () {
        copyText(item.code, this);
      });

      document.getElementById('selectBtn').addEventListener('click', function () {
        location.hash = item.id;
      });
    }

    function route() {
      const hash = location.hash.replace('#', '');
      if (hash && items.some(item => item.id === hash)) {
        cur = hash;
      }
      renderList();
      renderPanel();
    }

    q.addEventListener('input', renderList);
    window.addEventListener('hashchange', route);
    route();
  </script>
</body>
</html>
