<script id="data" type="application/json">[{"id": "a01", "file": "01_zigzag_rearrange.cpp", "title": "Zig-zag rearrange", "ds": "Array", "desc": "Every second element greater than its neighbours. O(n) time, O(1) space.", "code": "// Zig-zag rearrangement: every second element (index 1,3,5..) > its left & right neighbours\n// Data structure: array (vector). Time O(n), Space O(1). Assumes no duplicates.\n// To adapt: change the element type / swap condition (e.g. make every second element SMALLER).\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nvoid zigzag(vector<int>& a) {\n    int n = a.size();\n    for (int i = 1; i < n; i += 2) {\n        if (a[i - 1] > a[i]) swap(a[i - 1], a[i]);          // left must be smaller\n        if (i + 1 < n && a[i + 1] > a[i]) swap(a[i + 1], a[i]); // right must be smaller\n    }\n}\n\nint main() {\n    int n;\n    cout << \"Enter number of elements: \";\n    cin >> n;\n    vector<int> a(n);\n    cout << \"Enter \" << n << \" integers: \";\n    for (int &x : a) cin >> x;\n\n    zigzag(a);\n\n    cout << \"Rearranged: \";\n    for (int x : a) cout << x << \" \";\n    cout << \"\\n\";\n    return 0;\n}\n"}, {"id": "a02", "file": "02_sparse_matrix.cpp", "title": "Sparse matrix", "ds": "Triplet array", "desc": "Display, addition, simple and fast transpose.", "code": "// Sparse matrix using triplet (row, col, value) representation\n// Operations: display, addition, simple transpose, fast transpose\n// To adapt: change Term.v type (int -> double) or add more operations (multiply etc.)\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nstruct Term { int r, c, v; };\n\nclass Sparse {\npublic:\n    int rows = 0, cols = 0;\n    vector<Term> t;                       // kept sorted row-major\n\n    void readDense() {\n        cout << \"Rows and columns: \";\n        cin >> rows >> cols;\n        t.clear();\n        cout << \"Enter matrix (\" << rows << \"x\" << cols << \"):\\n\";\n        for (int i = 0; i < rows; i++)\n            for (int j = 0; j < cols; j++) {\n                int x; cin >> x;\n                if (x != 0) t.push_back({i, j, x});\n            }\n    }\n\n    void displayTriplet() const {\n        cout << \"Row Col Val\\n\" << rows << \"   \" << cols << \"   \" << t.size() << \"\\n\";\n        for (auto &e : t) cout << e.r << \"   \" << e.c << \"   \" << e.v << \"\\n\";\n    }\n\n    void displayMatrix() const {\n        size_t k = 0;\n        for (int i = 0; i < rows; i++) {\n            for (int j = 0; j < cols; j++) {\n                if (k < t.size() && t[k].r == i && t[k].c == j) cout << t[k++].v << \" \";\n                else cout << \"0 \";\n            }\n            cout << \"\\n\";\n        }\n    }\n\n    // Simple transpose: O(cols * nonzero)\n    Sparse transposeSimple() const {\n        Sparse res; res.rows = cols; res.cols = rows;\n        for (int c = 0; c < cols; c++)\n            for (auto &e : t)\n                if (e.c == c) res.t.push_back({e.c, e.r, e.v});\n        return res;\n    }\n\n    // Fast transpose: O(cols + nonzero)\n    Sparse transposeFast() const {\n        Sparse res; res.rows = cols; res.cols = rows;\n        res.t.resize(t.size());\n        vector<int> cnt(cols, 0), pos(cols, 0);\n        for (auto &e : t) cnt[e.c]++;\n        for (int i = 1; i < cols; i++) pos[i] = pos[i - 1] + cnt[i - 1];\n        for (auto &e : t) res.t[pos[e.c]++] = {e.c, e.r, e.v};\n        return res;\n    }\n\n    // Addition: O(n1 + n2)\n    static bool add(const Sparse &a, const Sparse &b, Sparse &res) {\n        if (a.rows != b.rows || a.cols != b.cols) return false;\n        res.rows = a.rows; res.cols = a.cols; res.t.clear();\n        size_t i = 0, j = 0;\n        while (i < a.t.size() && j < b.t.size()) {\n            long ka = (long)a.t[i].r * a.cols + a.t[i].c;\n            long kb = (long)b.t[j].r * b.cols + b.t[j].c;\n            if (ka < kb) res.t.push_back(a.t[i++]);\n            else if (kb < ka) res.t.push_back(b.t[j++]);\n            else {\n                int s = a.t[i].v + b.t[j].v;\n                if (s != 0) res.t.push_back({a.t[i].r, a.t[i].c, s});\n                i++; j++;\n            }\n        }\n        while (i < a.t.size()) res.t.push_back(a.t[i++]);\n        while (j < b.t.size()) res.t.push_back(b.t[j++]);\n        return true;\n    }\n};\n\nint main() {\n    Sparse A, B, R;\n    int ch;\n    do {\n        cout << \"\\n1.Read A  2.Read B  3.Show A  4.Show B  5.Add A+B  6.Transpose A (simple)  7.Transpose A (fast)  0.Exit\\nChoice: \";\n        cin >> ch;\n        switch (ch) {\n            case 1: A.readDense(); break;\n            case 2: B.readDense(); break;\n            case 3: A.displayTriplet(); A.displayMatrix(); break;\n            case 4: B.displayTriplet(); B.displayMatrix(); break;\n            case 5:\n                if (Sparse::add(A, B, R)) { cout << \"A + B:\\n\"; R.displayTriplet(); R.displayMatrix(); }\n                else cout << \"Dimensions must match!\\n\";\n                break;\n            case 6: R = A.transposeSimple(); R.displayTriplet(); R.displayMatrix(); break;\n            case 7: R = A.transposeFast();   R.displayTriplet(); R.displayMatrix(); break;\n        }\n    } while (ch != 0);\n    return 0;\n}\n"}, {"id": "a03", "file": "03_club_linked_list.cpp", "title": "ARTIMAS club", "ds": "Singly linked list", "desc": "President/secretary, add/delete, count, display, concatenate two divisions.", "code": "// ARTIMAS club: singly linked list. First node = President, last node = Secretary.\n// Features: add/delete members, president, secretary; count; display; concatenate two divisions.\n// To adapt: rename Member fields (prn, name -> id, title...) and the club name.\n#include <iostream>\n#include <string>\nusing namespace std;\n\nstruct Member {\n    string prn, name;\n    Member *next;\n    Member(string p, string n) : prn(p), name(n), next(nullptr) {}\n};\n\nclass Club {\n    Member *head = nullptr;\npublic:\n    ~Club() { clear(); }\n    void clear() {\n        while (head) { Member *t = head; head = head->next; delete t; }\n    }\n\n    // a) add ------------------------------------------------------------\n    void addPresident(string prn, string name) {      // insert at beginning\n        Member *n = new Member(prn, name);\n        n->next = head; head = n;\n    }\n    void addSecretary(string prn, string name) {      // insert at end\n        Member *n = new Member(prn, name);\n        if (!head) { head = n; return; }\n        Member *t = head;\n        while (t->next) t = t->next;\n        t->next = n;\n    }\n    void addMember(string prn, string name) {         // insert just before the secretary\n        Member *n = new Member(prn, name);\n        if (!head || !head->next) {                    // 0 or 1 node: append\n            if (!head) head = n; else head->next = n;\n            return;\n        }\n        Member *t = head;\n        while (t->next->next) t = t->next;             // t = node before last\n        n->next = t->next; t->next = n;\n    }\n\n    // a) delete ---------------------------------------------------------\n    bool deletePresident() {\n        if (!head) return false;\n        Member *t = head; head = head->next; delete t; return true;\n    }\n    bool deleteSecretary() {\n        if (!head) return false;\n        if (!head->next) { delete head; head = nullptr; return true; }\n        Member *t = head;\n        while (t->next->next) t = t->next;\n        delete t->next; t->next = nullptr; return true;\n    }\n    bool deleteMember(string prn) {                    // delete any node by PRN\n        if (!head) return false;\n        if (head->prn == prn) return deletePresident();\n        Member *t = head;\n        while (t->next && t->next->prn != prn) t = t->next;\n        if (!t->next) return false;\n        Member *d = t->next; t->next = d->next; delete d; return true;\n    }\n\n    // b) count ----------------------------------------------------------\n    int count() const {\n        int c = 0;\n        for (Member *t = head; t; t = t->next) c++;\n        return c;\n    }\n\n    // c) display --------------------------------------------------------\n    void display() const {\n        if (!head) { cout << \"Club is empty\\n\"; return; }\n        for (Member *t = head; t; t = t->next) {\n            cout << t->prn << \" | \" << t->name;\n            if (t == head) cout << \"  (President)\";\n            else if (!t->next) cout << \"  (Secretary)\";\n            cout << \"\\n\";\n        }\n        cout << \"Total members: \" << count() << \"\\n\";\n    }\n\n    // d) concatenate: append other list to this list, other becomes empty\n    void concatenate(Club &other) {\n        if (!other.head) return;\n        if (!head) head = other.head;\n        else {\n            Member *t = head;\n            while (t->next) t = t->next;\n            t->next = other.head;\n        }\n        other.head = nullptr;\n    }\n};\n\nint main() {\n    Club div[2];                                       // division A = 0, division B = 1\n    int ch, d;\n    string prn, name;\n    do {\n        cout << \"\\n1.Add President 2.Add Member 3.Add Secretary 4.Delete President 5.Delete Member\"\n                \"\\n6.Delete Secretary 7.Count 8.Display 9.Concatenate A+B 0.Exit\\nChoice: \";\n        cin >> ch;\n        if (ch >= 1 && ch <= 8) { cout << \"Division (0=A, 1=B): \"; cin >> d; if (d < 0 || d > 1) d = 0; }\n        if (ch >= 1 && ch <= 3) { cout << \"PRN: \"; cin >> prn; cout << \"Name: \"; cin.ignore(); getline(cin, name); }\n        switch (ch) {\n            case 1: div[d].addPresident(prn, name); break;\n            case 2: div[d].addMember(prn, name); break;\n            case 3: div[d].addSecretary(prn, name); break;\n            case 4: if (!div[d].deletePresident()) cout << \"Empty!\\n\"; break;\n            case 5:\n                cout << \"PRN to delete: \"; cin >> prn;\n                if (!div[d].deleteMember(prn)) cout << \"Not found!\\n\";\n                break;\n            case 6: if (!div[d].deleteSecretary()) cout << \"Empty!\\n\"; break;\n            case 7: cout << \"Members: \" << div[d].count() << \"\\n\"; break;\n            case 8: div[d].display(); break;\n            case 9: div[0].concatenate(div[1]); cout << \"Concatenated into A:\\n\"; div[0].display(); break;\n        }\n    } while (ch != 0);\n    return 0;\n}\n"}, {"id": "a04", "file": "04_cinema_booking.cpp", "title": "Cinemax ticket booking", "ds": "Doubly circular list", "desc": "Free seats per row, book and cancel seats.", "code": "// Cinemax ticket booking: doubly circular linked list of FREE seats per row,\n// array of head pointers (one per row). Seats are kept in ascending order.\n// To adapt: change Seat to hold more info (price, type) or rows to halls/shows.\n#include <iostream>\n#include <vector>\n#include <cstdlib>\n#include <ctime>\nusing namespace std;\n\nstruct Seat {\n    int no;\n    Seat *prev, *next;\n};\n\nclass Cinema {\n    int m, n;                      // m rows, n seats per row\n    vector<Seat*> head;            // head[r] -> first free seat of row r (nullptr if row full)\n\n    Seat* find(int r, int s) const {\n        Seat *h = head[r];\n        if (!h) return nullptr;\n        Seat *p = h;\n        do { if (p->no == s) return p; p = p->next; } while (p != h);\n        return nullptr;\n    }\n    bool valid(int r, int s) const { return r >= 0 && r < m && s >= 1 && s <= n; }\n\npublic:\n    Cinema(int rows, int seats) : m(rows), n(seats), head(rows, nullptr) {\n        for (int r = 0; r < m; r++)                    // all seats free initially\n            for (int s = 1; s <= n; s++) cancel(r, s, true);\n    }\n    ~Cinema() {\n        for (int r = 0; r < m; r++) {\n            Seat *h = head[r];\n            if (!h) continue;\n            h->prev->next = nullptr;                   // break the circle\n            while (h) { Seat *t = h; h = h->next; delete t; }\n        }\n    }\n\n    // a) display free seats\n    void display() const {\n        for (int r = 0; r < m; r++) {\n            cout << \"Row \" << r + 1 << \": \";\n            Seat *h = head[r];\n            if (!h) { cout << \"FULL\\n\"; continue; }\n            Seat *p = h;\n            do { cout << p->no << \" \"; p = p->next; } while (p != h);\n            cout << \"\\n\";\n        }\n    }\n\n    // b) book seat (remove from free list)\n    bool book(int r, int s) {\n        if (!valid(r, s)) return false;\n        Seat *p = find(r, s);\n        if (!p) return false;                          // already booked\n        if (p->next == p) head[r] = nullptr;           // only seat in row\n        else {\n            p->prev->next = p->next;\n            p->next->prev = p->prev;\n            if (p == head[r]) head[r] = p->next;\n        }\n        delete p;\n        return true;\n    }\n\n    // c) cancel booking (insert back in sorted position)\n    bool cancel(int r, int s, bool silentInit = false) {\n        if (!valid(r, s)) return false;\n        if (!silentInit && find(r, s)) return false;   // seat is already free\n        Seat *x = new Seat{s, nullptr, nullptr};\n        Seat *h = head[r];\n        if (!h) { x->next = x->prev = x; head[r] = x; return true; }\n        if (s < h->no) {                               // new smallest -> becomes head\n            Seat *tail = h->prev;\n            x->next = h; x->prev = tail;\n            tail->next = x; h->prev = x;\n            head[r] = x;\n            return true;\n        }\n        Seat *p = h;\n        while (p->next != h && p->next->no < s) p = p->next;\n        x->next = p->next; x->prev = p;\n        p->next->prev = x; p->next = x;\n        return true;\n    }\n\n    void randomBooking(int k) {\n        while (k--) book(rand() % m, rand() % n + 1);\n    }\n};\n\nint main() {\n    srand(time(nullptr));\n    int m, n;\n    cout << \"Rows and seats per row: \";\n    cin >> m >> n;\n    Cinema c(m, n);\n    c.randomBooking(m * n / 3);                        // some random initial bookings\n    int ch, r, s;\n    do {\n        cout << \"\\n1.Show free seats 2.Book 3.Cancel 0.Exit\\nChoice: \";\n        cin >> ch;\n        if (ch == 1) c.display();\n        else if (ch == 2 || ch == 3) {\n            cout << \"Row (1..\" << m << \") and Seat (1..\" << n << \"): \";\n            cin >> r >> s;\n            bool ok = (ch == 2) ? c.book(r - 1, s) : c.cancel(r - 1, s);\n            cout << (ok ? \"Done\\n\" : \"Failed (invalid / already booked / already free)\\n\");\n        }\n    } while (ch != 0);\n    return 0;\n}\n"}, {"id": "a05", "file": "05_infix_to_postfix.cpp", "title": "Infix to postfix", "ds": "Stack", "desc": "Single-character operands, + - * / and parentheses, plus evaluation.", "code": "// Infix -> Postfix using a stack (array based).\n// Constraints: single-character operands, operators + - * / (also handles parentheses).\n// Bonus: evaluate postfix when operands are single digits.\n// To adapt: change prec() to add operators like ^ or %.\n#include <iostream>\n#include <string>\n#include <cctype>\nusing namespace std;\n\nconst int MAX = 100;\n\ntemplate <class T>\nclass Stack {\n    T a[MAX];\n    int top = -1;\npublic:\n    bool empty() const { return top == -1; }\n    bool full() const { return top == MAX - 1; }\n    void push(T x) { if (!full()) a[++top] = x; }\n    T pop() { return a[top--]; }\n    T peek() const { return a[top]; }\n};\n\nint prec(char c) {\n    if (c == '*' || c == '/') return 2;\n    if (c == '+' || c == '-') return 1;\n    return 0;\n}\nbool isOp(char c) { return c == '+' || c == '-' || c == '*' || c == '/'; }\n\nbool infixToPostfix(const string &in, string &out) {\n    Stack<char> st;\n    out = \"\";\n    for (char ch : in) {\n        if (ch == ' ') continue;\n        if (isalnum(ch)) out += ch;                         // operand\n        else if (ch == '(') st.push(ch);\n        else if (ch == ')') {\n            while (!st.empty() && st.peek() != '(') out += st.pop();\n            if (st.empty()) return false;                   // unbalanced\n            st.pop();                                       // discard '('\n        } else if (isOp(ch)) {\n            while (!st.empty() && st.peek() != '(' && prec(st.peek()) >= prec(ch))\n                out += st.pop();                            // left associative\n            st.push(ch);\n        } else return false;                                // invalid character\n    }\n    while (!st.empty()) {\n        char c = st.pop();\n        if (c == '(') return false;\n        out += c;\n    }\n    return true;\n}\n\nint evaluatePostfix(const string &p) {                      // operands must be single digits\n    Stack<int> st;\n    for (char ch : p) {\n        if (isdigit(ch)) st.push(ch - '0');\n        else {\n            int b = st.pop(), a = st.pop();\n            switch (ch) {\n                case '+': st.push(a + b); break;\n                case '-': st.push(a - b); break;\n                case '*': st.push(a * b); break;\n                case '/': st.push(b ? a / b : 0); break;\n            }\n        }\n    }\n    return st.pop();\n}\n\nint main() {\n    string in, out;\n    cout << \"Enter infix expression (e.g. a+b*(c-d)/e): \";\n    getline(cin, in);\n    if (infixToPostfix(in, out)) {\n        cout << \"Postfix: \" << out << \"\\n\";\n        bool allDigits = true;\n        for (char c : out) if (isalpha(c)) allDigits = false;\n        if (allDigits) cout << \"Value: \" << evaluatePostfix(out) << \"\\n\";\n    } else cout << \"Invalid expression!\\n\";\n    return 0;\n}\n"}, {"id": "a06", "file": "06_pizza_circular_queue.cpp", "title": "Pizza parlor orders", "ds": "Circular queue", "desc": "First come first served with at most M orders.", "code": "// Pizza parlor: max M orders, served First Come First Served, no cancellation.\n// Circular queue using an array. Time O(1) per operation.\n// To adapt: change Order fields (e.g. token, items, price) or the queue name (tickets, print jobs...).\n#include <iostream>\n#include <string>\nusing namespace std;\n\nstruct Order {\n    int id;\n    string customer, pizza;\n};\n\nclass CircularQueue {\n    Order *a;\n    int M, front, rear, cnt;\npublic:\n    CircularQueue(int m) : M(m), front(0), rear(-1), cnt(0) { a = new Order[M]; }\n    ~CircularQueue() { delete[] a; }\n    bool isFull() const { return cnt == M; }\n    bool isEmpty() const { return cnt == 0; }\n\n    bool place(const Order &o) {                  // enqueue\n        if (isFull()) return false;\n        rear = (rear + 1) % M;\n        a[rear] = o; cnt++;\n        return true;\n    }\n    bool serve(Order &o) {                        // dequeue\n        if (isEmpty()) return false;\n        o = a[front];\n        front = (front + 1) % M; cnt--;\n        return true;\n    }\n    void display() const {\n        if (isEmpty()) { cout << \"No pending orders\\n\"; return; }\n        for (int i = 0, k = front; i < cnt; i++, k = (k + 1) % M)\n            cout << \"Order #\" << a[k].id << \" | \" << a[k].customer << \" | \" << a[k].pizza << \"\\n\";\n    }\n};\n\nint main() {\n    int M;\n    cout << \"Maximum orders the parlor can accept: \";\n    cin >> M;\n    CircularQueue q(M);\n    int ch, nextId = 1;\n    do {\n        cout << \"\\n1.Place order 2.Serve order 3.Show pending 0.Exit\\nChoice: \";\n        cin >> ch;\n        if (ch == 1) {\n            Order o; o.id = nextId;\n            cout << \"Customer name: \"; cin >> o.customer;\n            cout << \"Pizza: \"; cin >> o.pizza;\n            if (q.place(o)) { cout << \"Order #\" << nextId++ << \" placed\\n\"; }\n            else cout << \"Parlor is full, cannot accept more orders!\\n\";\n        } else if (ch == 2) {\n            Order o;\n            if (q.serve(o)) cout << \"Served order #\" << o.id << \" (\" << o.customer << \", \" << o.pizza << \")\\n\";\n            else cout << \"No orders to serve\\n\";\n        } else if (ch == 3) q.display();\n    } while (ch != 0);\n    return 0;\n}\n"}, {"id": "a07", "file": "07_threaded_binary_tree.cpp", "title": "Threaded binary tree", "ds": "Binary tree", "desc": "Convert a tree to a threaded tree and traverse with threads.", "code": "// Convert a binary tree into a (double) inorder threaded binary tree.\n// Input: level order, -1 = no node.  e.g.  1 2 3 4 5 -1 6\n// Method: inorder traversal -> list of nodes, then null left/right pointers are replaced\n//         with inorder predecessor / successor (threads).\n// Time: O(n)   Space: O(n) for the node list (+ O(h) recursion).\n// To adapt: change Node.data (e.g. struct with name/id) or build the tree from a BST insert.\n#include <iostream>\n#include <vector>\n#include <queue>\nusing namespace std;\n\nstruct Node {\n    int data;\n    Node *left, *right;\n    bool lthread, rthread;            // true => pointer is a thread, not a child\n    Node(int d) : data(d), left(nullptr), right(nullptr), lthread(false), rthread(false) {}\n};\n\nNode* buildLevelOrder(const vector<int> &v) {\n    if (v.empty() || v[0] == -1) return nullptr;\n    Node *root = new Node(v[0]);\n    queue<Node*> q; q.push(root);\n    size_t i = 1;\n    while (!q.empty() && i < v.size()) {\n        Node *cur = q.front(); q.pop();\n        if (i < v.size() && v[i] != -1) { cur->left = new Node(v[i]); q.push(cur->left); }\n        i++;\n        if (i < v.size() && v[i] != -1) { cur->right = new Node(v[i]); q.push(cur->right); }\n        i++;\n    }\n    return root;\n}\n\nvoid inorderList(Node *r, vector<Node*> &out) {\n    if (!r) return;\n    inorderList(r->left, out);\n    out.push_back(r);\n    inorderList(r->right, out);\n}\n\nvoid makeThreaded(Node *root) {\n    vector<Node*> in;\n    inorderList(root, in);\n    for (size_t i = 0; i < in.size(); i++) {\n        if (!in[i]->left)  { in[i]->left  = i ? in[i - 1] : nullptr;            in[i]->lthread = true; }\n        if (!in[i]->right) { in[i]->right = i + 1 < in.size() ? in[i + 1] : nullptr; in[i]->rthread = true; }\n    }\n}\n\n// Inorder traversal WITHOUT recursion or stack, using threads\nvoid threadedInorder(Node *root) {\n    Node *p = root;\n    while (p && p->left && !p->lthread) p = p->left;       // leftmost node\n    while (p) {\n        cout << p->data << \" \";\n        if (p->rthread) p = p->right;                       // follow thread\n        else {\n            p = p->right;\n            while (p && p->left && !p->lthread) p = p->left;\n        }\n    }\n    cout << \"\\n\";\n}\n\nvoid freeTree(Node *root) {\n    vector<Node*> in;\n    // after threading, collect via threaded traversal\n    Node *p = root;\n    while (p && p->left && !p->lthread) p = p->left;\n    while (p) {\n        in.push_back(p);\n        if (p->rthread) p = p->right;\n        else { p = p->right; while (p && p->left && !p->lthread) p = p->left; }\n    }\n    for (Node *x : in) delete x;\n}\n\nint main() {\n    int n;\n    cout << \"Number of entries (level order, -1 for null): \";\n    cin >> n;\n    vector<int> v(n);\n    cout << \"Enter entries: \";\n    for (int &x : v) cin >> x;\n\n    Node *root = buildLevelOrder(v);\n    makeThreaded(root);\n    cout << \"Inorder using threads: \";\n    threadedInorder(root);\n    freeTree(root);\n    return 0;\n}\n"}, {"id": "a08", "file": "08_binary_search.cpp", "title": "Binary search", "ds": "Sorted array", "desc": "Iterative and recursive. O(log n).", "code": "// Binary search on a sorted list. Prints index of target or -1.\n// Time: O(log n)   Space: O(1) iterative, O(log n) recursive (call stack).\n// To adapt: search on strings/structs by key, or return first/last occurrence.\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint binarySearchIter(const vector<int> &a, int target) {\n    int lo = 0, hi = (int)a.size() - 1;\n    while (lo <= hi) {\n        int mid = lo + (hi - lo) / 2;\n        if (a[mid] == target) return mid;\n        if (a[mid] < target) lo = mid + 1;\n        else hi = mid - 1;\n    }\n    return -1;\n}\n\nint binarySearchRec(const vector<int> &a, int lo, int hi, int target) {\n    if (lo > hi) return -1;\n    int mid = lo + (hi - lo) / 2;\n    if (a[mid] == target) return mid;\n    if (a[mid] < target) return binarySearchRec(a, mid + 1, hi, target);\n    return binarySearchRec(a, lo, mid - 1, target);\n}\n\nint main() {\n    int n, target;\n    cin >> n;\n    vector<int> a(n);\n    for (int &x : a) cin >> x;      // must be sorted ascending\n    cin >> target;\n\n    cout << binarySearchIter(a, target) << \"\\n\";\n    // cout << binarySearchRec(a, 0, n - 1, target) << \"\\n\";   // recursive version\n    return 0;\n}\n"}, {"id": "a09", "file": "09_graph_bfs_dfs.cpp", "title": "Graph BFS and DFS", "ds": "Adjacency list", "desc": "Traversal order from a start vertex.", "code": "// BFS and DFS on an undirected graph (adjacency list). Returns visit order from a start vertex.\n// Time: O(V + E)   Space: O(V)\n// To adapt: use string vertex names (map<string,int>), directed edges, or find components/shortest path.\n#include <iostream>\n#include <vector>\n#include <queue>\n#include <algorithm>\nusing namespace std;\n\nvector<int> bfs(const vector<vector<int>> &adj, int start) {\n    vector<int> order, vis(adj.size(), 0);\n    queue<int> q;\n    vis[start] = 1; q.push(start);\n    while (!q.empty()) {\n        int u = q.front(); q.pop();\n        order.push_back(u);\n        for (int v : adj[u])\n            if (!vis[v]) { vis[v] = 1; q.push(v); }\n    }\n    return order;\n}\n\nvoid dfsUtil(const vector<vector<int>> &adj, int u, vector<int> &vis, vector<int> &order) {\n    vis[u] = 1;\n    order.push_back(u);\n    for (int v : adj[u])\n        if (!vis[v]) dfsUtil(adj, v, vis, order);\n}\n\nvector<int> dfs(const vector<vector<int>> &adj, int start) {\n    vector<int> order, vis(adj.size(), 0);\n    dfsUtil(adj, start, vis, order);\n    return order;\n}\n\nint main() {\n    int V, E;\n    cout << \"Vertices (0..V-1) and edges: \";\n    cin >> V >> E;\n    vector<vector<int>> adj(V);\n    cout << \"Enter \" << E << \" edges (u v):\\n\";\n    for (int i = 0; i < E; i++) {\n        int u, v; cin >> u >> v;\n        adj[u].push_back(v);\n        adj[v].push_back(u);                       // undirected; remove this line for directed graph\n    }\n    for (auto &l : adj) sort(l.begin(), l.end());  // visit smaller neighbours first\n    int s;\n    cout << \"Start vertex: \";\n    cin >> s;\n\n    cout << \"BFS: \"; for (int x : bfs(adj, s)) cout << x << \" \"; cout << \"\\n\";\n    cout << \"DFS: \"; for (int x : dfs(adj, s)) cout << x << \" \"; cout << \"\\n\";\n    return 0;\n}\n"}, {"id": "a10", "file": "10_minimum_spanning_tree.cpp", "title": "Minimum spanning tree", "ds": "Graph, DSU, heap", "desc": "Kruskal and Prim for leasing phone lines.", "code": "// Lease phone lines at minimum total cost = Minimum Spanning Tree of a weighted graph.\n// Data structures: edge list + Disjoint Set (Kruskal), adjacency list + min-heap (Prim).\n// Kruskal: O(E log E)   Prim: O(E log V)\n// To adapt: rename vertices to city names (map<string,int>), roads, cables, pipelines etc.\n#include <iostream>\n#include <vector>\n#include <queue>\n#include <algorithm>\nusing namespace std;\n\nstruct Edge { int u, v, w; };\n\n// ---------- Disjoint Set ----------\nstruct DSU {\n    vector<int> p, r;\n    DSU(int n) : p(n), r(n, 0) { for (int i = 0; i < n; i++) p[i] = i; }\n    int find(int x) { return p[x] == x ? x : p[x] = find(p[x]); }\n    bool unite(int a, int b) {\n        a = find(a); b = find(b);\n        if (a == b) return false;\n        if (r[a] < r[b]) swap(a, b);\n        p[b] = a;\n        if (r[a] == r[b]) r[a]++;\n        return true;\n    }\n};\n\nlong long kruskal(int n, vector<Edge> edges, vector<Edge> &mst) {\n    sort(edges.begin(), edges.end(), [](const Edge &a, const Edge &b) { return a.w < b.w; });\n    DSU d(n);\n    long long total = 0;\n    for (auto &e : edges)\n        if (d.unite(e.u, e.v)) { mst.push_back(e); total += e.w; }\n    return total;\n}\n\nlong long prim(int n, const vector<vector<pair<int,int>>> &adj, vector<Edge> &mst) {\n    typedef tuple<int,int,int> T;                       // (weight, vertex, parent)\n    priority_queue<T, vector<T>, greater<T>> pq;\n    vector<int> in(n, 0);\n    long long total = 0;\n    pq.push(T(0, 0, -1));\n    while (!pq.empty()) {\n        auto [w, u, par] = pq.top(); pq.pop();\n        if (in[u]) continue;\n        in[u] = 1; total += w;\n        if (par != -1) mst.push_back({par, u, w});\n        for (auto [v, wt] : adj[u])\n            if (!in[v]) pq.push(T(wt, v, u));\n    }\n    return total;\n}\n\nint main() {\n    int n, m;\n    cout << \"Number of offices (0..n-1) and possible connections: \";\n    cin >> n >> m;\n    vector<Edge> edges(m);\n    vector<vector<pair<int,int>>> adj(n);\n    cout << \"Enter each connection as: office1 office2 cost\\n\";\n    for (auto &e : edges) {\n        cin >> e.u >> e.v >> e.w;\n        adj[e.u].push_back({e.v, e.w});\n        adj[e.v].push_back({e.u, e.w});\n    }\n\n    vector<Edge> mst;\n    long long cost = kruskal(n, edges, mst);\n    if ((int)mst.size() != n - 1) { cout << \"Offices cannot all be connected!\\n\"; return 0; }\n    cout << \"\\nKruskal MST:\\n\";\n    for (auto &e : mst) cout << e.u << \" - \" << e.v << \"  cost \" << e.w << \"\\n\";\n    cout << \"Total cost = \" << cost << \"\\n\";\n\n    mst.clear();\n    cost = prim(n, adj, mst);\n    cout << \"\\nPrim MST:\\n\";\n    for (auto &e : mst) cout << e.u << \" - \" << e.v << \"  cost \" << e.w << \"\\n\";\n    cout << \"Total cost = \" << cost << \"\\n\";\n    return 0;\n}\n"}, {"id": "a11", "file": "11_product_sorting.cpp", "title": "Product sorting", "ds": "Sorting algorithms", "desc": "Quick, merge, insertion and selection sort with timing.", "code": "// E-commerce catalog sorting + efficiency analysis.\n//  1) Sort by price      : Quick sort / Merge sort\n//  2) Sort by popularity : Insertion sort / Selection sort\n// Measures execution time (chrono) and reports auxiliary memory used by each algorithm.\n// To adapt: change Product fields (rating, discount...) and the comparators in main().\n#include <iostream>\n#include <vector>\n#include <string>\n#include <chrono>\n#include <cstdlib>\n#include <iomanip>\nusing namespace std;\nusing namespace chrono;\n\nstruct Product {\n    int id;\n    string name;\n    double price;\n    int popularity;       // e.g. units sold / views\n};\n\n// ---------------- Quick sort (avg O(n log n), worst O(n^2), aux O(log n)) ----------------\ntemplate <class C>\nint partitionQ(vector<Product> &a, int lo, int hi, C cmp) {\n    swap(a[lo + rand() % (hi - lo + 1)], a[hi]);          // random pivot\n    Product pivot = a[hi];\n    int i = lo - 1;\n    for (int j = lo; j < hi; j++)\n        if (cmp(a[j], pivot)) swap(a[++i], a[j]);\n    swap(a[i + 1], a[hi]);\n    return i + 1;\n}\ntemplate <class C>\nvoid quickSort(vector<Product> &a, int lo, int hi, C cmp) {\n    if (lo >= hi) return;\n    int p = partitionQ(a, lo, hi, cmp);\n    quickSort(a, lo, p - 1, cmp);\n    quickSort(a, p + 1, hi, cmp);\n}\n\n// ---------------- Merge sort (O(n log n) always, aux O(n)) ----------------\ntemplate <class C>\nvoid mergeSort(vector<Product> &a, vector<Product> &tmp, int lo, int hi, C cmp) {\n    if (lo >= hi) return;\n    int mid = (lo + hi) / 2;\n    mergeSort(a, tmp, lo, mid, cmp);\n    mergeSort(a, tmp, mid + 1, hi, cmp);\n    int i = lo, j = mid + 1, k = lo;\n    while (i <= mid && j <= hi) tmp[k++] = cmp(a[j], a[i]) ? a[j++] : a[i++];\n    while (i <= mid) tmp[k++] = a[i++];\n    while (j <= hi) tmp[k++] = a[j++];\n    for (k = lo; k <= hi; k++) a[k] = tmp[k];\n}\n\n// ---------------- Insertion sort (O(n^2), best O(n), aux O(1)) ----------------\ntemplate <class C>\nvoid insertionSort(vector<Product> &a, C cmp) {\n    for (size_t i = 1; i < a.size(); i++) {\n        Product key = a[i];\n        int j = i - 1;\n        while (j >= 0 && cmp(key, a[j])) { a[j + 1] = a[j]; j--; }\n        a[j + 1] = key;\n    }\n}\n\n// ---------------- Selection sort (O(n^2) always, aux O(1)) ----------------\ntemplate <class C>\nvoid selectionSort(vector<Product> &a, C cmp) {\n    for (size_t i = 0; i + 1 < a.size(); i++) {\n        size_t best = i;\n        for (size_t j = i + 1; j < a.size(); j++)\n            if (cmp(a[j], a[best])) best = j;\n        swap(a[i], a[best]);\n    }\n}\n\n// ---------------- helpers ----------------\nvector<Product> generate(int n) {\n    vector<Product> v(n);\n    for (int i = 0; i < n; i++)\n        v[i] = {i + 1, \"Product\" + to_string(i + 1), 10 + rand() % 99000 / 10.0, rand() % 100000};\n    return v;\n}\n\nvoid showTop(const vector<Product> &v, int k = 5) {\n    for (int i = 0; i < k && i < (int)v.size(); i++)\n        cout << \"   \" << v[i].name << \"  price=\" << fixed << setprecision(2) << v[i].price\n             << \"  popularity=\" << v[i].popularity << \"\\n\";\n}\n\ntemplate <class F>\ndouble timeIt(F f) {\n    auto s = high_resolution_clock::now();\n    f();\n    return duration<double, milli>(high_resolution_clock::now() - s).count();\n}\n\nint main() {\n    srand(42);\n    int n;\n    cout << \"Number of products (try 1000, 5000, 20000): \";\n    cin >> n;\n    vector<Product> base = generate(n);\n    size_t sz = sizeof(Product);\n\n    auto byPrice = [](const Product &a, const Product &b) { return a.price < b.price; };        // ascending\n    auto byPop   = [](const Product &a, const Product &b) { return a.popularity > b.popularity; }; // most popular first\n\n    cout << \"\\n=== Sort by PRICE ===\\n\";\n    vector<Product> a = base;\n    double tq = timeIt([&] { quickSort(a, 0, n - 1, byPrice); });\n    cout << \"Quick sort  : \" << tq << \" ms, aux memory ~ O(log n) stack (~\" << (int)(32 * 24) << \" bytes)\\n\";\n    showTop(a);\n\n    a = base; vector<Product> tmp(n);\n    double tm = timeIt([&] { mergeSort(a, tmp, 0, n - 1, byPrice); });\n    cout << \"Merge sort  : \" << tm << \" ms, aux memory = \" << (n * sz) / 1024.0 << \" KB (temp array)\\n\";\n\n    cout << \"\\n=== Sort by POPULARITY ===\\n\";\n    a = base;\n    double ti = timeIt([&] { insertionSort(a, byPop); });\n    cout << \"Insertion   : \" << ti << \" ms, aux memory O(1) (one extra Product = \" << sz << \" bytes)\\n\";\n    showTop(a);\n\n    a = base;\n    double ts = timeIt([&] { selectionSort(a, byPop); });\n    cout << \"Selection   : \" << ts << \" ms, aux memory O(1)\\n\";\n\n    cout << \"\\nCatalog size in memory: \" << (n * sz) / 1024.0 << \" KB\\n\";\n    return 0;\n}\n"}, {"id": "a12", "file": "12_hash_employee_auth.cpp", "title": "Employee authentication", "ds": "Hash table", "desc": "Usernames and hashed passwords with chaining.", "code": "// Employee authentication using a hash table (separate chaining).\n// Key = username, value = hashed password. Login hashes the entered password and compares.\n// NOTE: FNV-1a is used only for learning. Real systems use salted slow hashes (bcrypt/Argon2).\n// To adapt: store more fields (role, email) in Employee, or use another key (employee id).\n#include <iostream>\n#include <string>\n#include <vector>\n#include <list>\n#include <sstream>\n#include <iomanip>\nusing namespace std;\n\nstruct Employee {\n    string username;\n    string passHash;\n};\n\n// Hash for password (64-bit FNV-1a -> hex string). Username is used as a simple salt.\nstring hashPassword(const string &user, const string &pass) {\n    unsigned long long h = 1469598103934665603ULL;\n    string s = user + \":\" + pass;\n    for (unsigned char c : s) { h ^= c; h *= 1099511628211ULL; }\n    ostringstream os;\n    os << hex << setw(16) << setfill('0') << h;\n    return os.str();\n}\n\nclass HashTable {\n    vector<list<Employee>> table;\n    int size, count = 0;\n\n    int index(const string &key) const {               // hash function for the key (djb2)\n        unsigned long h = 5381;\n        for (unsigned char c : key) h = h * 33 + c;\n        return h % size;\n    }\npublic:\n    HashTable(int sz = 11) : table(sz), size(sz) {}\n\n    bool addEmployee(const string &user, const string &pass) {\n        int i = index(user);\n        for (auto &e : table[i]) if (e.username == user) return false;   // duplicate\n        table[i].push_back({user, hashPassword(user, pass)});\n        count++;\n        return true;\n    }\n    bool authenticate(const string &user, const string &pass) const {\n        int i = index(user);\n        for (auto &e : table[i])\n            if (e.username == user) return e.passHash == hashPassword(user, pass);\n        return false;\n    }\n    bool removeEmployee(const string &user) {\n        int i = index(user);\n        for (auto it = table[i].begin(); it != table[i].end(); ++it)\n            if (it->username == user) { table[i].erase(it); count--; return true; }\n        return false;\n    }\n    void display() const {\n        for (int i = 0; i < size; i++) {\n            cout << \"[\" << i << \"] \";\n            for (auto &e : table[i]) cout << e.username << \":\" << e.passHash << \"  \";\n            cout << \"\\n\";\n        }\n        cout << \"Employees: \" << count << \"\\n\";\n    }\n};\n\nint main() {\n    HashTable ht;\n    int ch;\n    string u, p;\n    do {\n        cout << \"\\n1.Register 2.Login 3.Remove 4.Display table 0.Exit\\nChoice: \";\n        cin >> ch;\n        if (ch >= 1 && ch <= 3) { cout << \"Username: \"; cin >> u; }\n        if (ch == 1 || ch == 2) { cout << \"Password: \"; cin >> p; }\n        switch (ch) {\n            case 1: cout << (ht.addEmployee(u, p) ? \"Registered\\n\" : \"Username already exists\\n\"); break;\n            case 2: cout << (ht.authenticate(u, p) ? \"Authentication successful\\n\" : \"Invalid username or password\\n\"); break;\n            case 3: cout << (ht.removeEmployee(u) ? \"Removed\\n\" : \"Not found\\n\"); break;\n            case 4: ht.display(); break;\n        }\n    } while (ch != 0);\n    return 0;\n}\n"}]</script>
<script>
var items=JSON.parse(document.getElementById("data").textContent);
var list=document.getElementById("list"),panel=document.getElementById("panel"),q=document.getElementById("q");
var cur=items[0].id;
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function copyText(t,btn,label){
  function done(){var o=btn.textContent;btn.textContent=label||"Copied ✓";setTimeout(function(){btn.textContent=o},1500)}
  function fallback(){var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}document.body.removeChild(a);done()}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fallback)}else fallback()
}
function renderList(){
  var s=q.value.toLowerCase();list.innerHTML="";
  items.filter(function(i){return (i.title+i.ds+i.desc).toLowerCase().indexOf(s)>-1}).forEach(function(i){
    var b=document.createElement("button");b.className="item"+(i.id===cur?" on":"");
    b.innerHTML=esc(i.id.slice(1)+". "+i.title)+"<small>"+esc(i.ds)+"</small>";
    b.onclick=function(){location.hash=i.id};list.appendChild(b)})
  if(!list.children.length)list.innerHTML='<div class="empty">No match</div>'
}
function renderPanel(){
  var i=items.filter(function(x){return x.id===cur})[0]||items[0];
  panel.innerHTML='<div class="head"><span class="tag">'+esc(i.ds)+'</span><h2>'+esc(i.title)+'</h2><p>'+esc(i.desc)+' · '+esc(i.file)+'</p><div class="btns"><button class="act" id="c1">Copy code</button></div></div><div class="codewrap"><pre>'+esc(i.code)+'</pre></div>';
  document.getElementById("c1").onclick=function(){copyText(i.code,this)}
}
function route(){var h=location.hash.slice(1);if(items.some(function(x){return x.id===h}))cur=h;renderList();renderPanel()}
q.oninput=renderList;window.addEventListener("hashchange",route);route();
</script></body></html>
